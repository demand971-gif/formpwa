name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web assets
        run: |
          chmod +x scripts/sync-assets.sh
          ./scripts/sync-assets.sh

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK outputs
        run: |
          mkdir -p build-outputs
          cp android/app/build/outputs/apk/debug/*.apk build-outputs/FORM-debug.apk || true
          cp android/app/build/outputs/apk/release/*.apk build-outputs/FORM-release.apk || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FORM-APK
          path: build-outputs/*.apk
          retention-days: 30
