name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Initialize Capacitor (if not already done)
        run: npx cap init "GymApp" "com.demand971.gif.gymapp" || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync

      - name: Build Android APK (debug)
        # This step assumes the self‑hosted runner has the Android SDK/NDK
        # installed and ANDROID_HOME is set in the environment.
        # It runs the Capacitor build which invokes gradle (assembleDebug).
        run: npx cap build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: gymapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk