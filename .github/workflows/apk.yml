name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Initialize Capacitor (if not already done)
        run: npx cap init "GymApp" "com.demand971.gif.gymapp" || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync

      - name: Build Android APK
        # The following step requires an Android SDK to be available.
        # If you have a self‑hosted runner with the SDK installed, or you
        # use a remote build service, uncomment and adjust the command.
        # Otherwise you can run `./gradlew assembleDebug` on a local machine
        # or on a runner that has the Android NDK/SDK.
        # See: https://github.com/maxbyte96/capacitor-android-action
        # run: |
        #   export ANDROID_HOME="$HOME/android-sdk"
        #   export PATH="$ANDROID_HOME/platform-tools:$PATH"
        #   npx cap build android --release
        # For a debug APK you can use:
        #   npx cap build android

      - name: Upload APK as artifact (if built)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: gymapp-apk
          path: android/app/build/outputs/apk/**
