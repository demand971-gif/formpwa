name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Sync web assets into Android project (builds Vite app)
        run: |
          chmod +x scripts/sync-assets.sh
          ./scripts/sync-assets.sh

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p build-outputs
          cp android/app/build/outputs/apk/debug/*.apk build-outputs/FORM-debug.apk
          cp android/app/build/outputs/apk/release/*.apk build-outputs/FORM-release.apk
          ls -lh build-outputs

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FORM-APK
          path: build-outputs/*.apk
          retention-days: 30
          if-no-files-found: error
